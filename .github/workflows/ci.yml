name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-standalone-test.txt
      - name: POSIX regression tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s test -p 'test_*.py'
      - name: Windows deployment and API tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $patterns = @('test_auto_deploy.py', 'test_install_sources.py', 'test_preflight.py', 'test_log_queries.py', 'test_progress.py')
          foreach ($pattern in $patterns) {
            python -m unittest discover -s test -p $pattern
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Isolated application smoke test
        run: python scripts/smoke_test.py
      - name: Windows launch script preparation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/deploy.ps1 -PrepareOnly -PipSource pypi
          exit $LASTEXITCODE
