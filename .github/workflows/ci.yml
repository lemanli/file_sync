name: Checks
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-standalone-test.txt
      - name: POSIX regression tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s test -p 'test_*.py'
      - name: Windows deployment and API tests
        if: runner.os == 'Windows'
        run: python scripts/ci_tests.py test_auto_deploy.py test_install_sources.py test_preflight.py test_log_queries.py test_progress.py test_task_control.py test_storage.py test_scanning.py test_network_recovery.py test_directory_scanner.py
      - name: Isolated application smoke test
        run: python scripts/smoke_test.py
      - name: Windows launch script preparation
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './scripts/deploy.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          & ./scripts/deploy.ps1 -PrepareOnly -PipSource pypi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/deploy.ps1 -PrepareOnly -Environment direct -PythonPath (Get-Command python).Source -PipSource pypi
          exit $LASTEXITCODE
      - name: Windows CMD direct installation
        if: runner.os == 'Windows'
        shell: cmd
        run: start-standalone.cmd --environment direct --prepare-only --pip-source pypi
