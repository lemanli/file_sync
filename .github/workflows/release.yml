name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and run tests
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          python -m pip install -r backend/requirements-standalone-test.txt
          python -m unittest discover -s test -p 'test_*.py'
          python scripts/smoke_test.py
      - name: Build source archives and checksums
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="file_sync-$GITHUB_REF_NAME/" HEAD > "dist/file_sync-$GITHUB_REF_NAME.zip"
          git archive --format=tar.gz --prefix="file_sync-$GITHUB_REF_NAME/" HEAD > "dist/file_sync-$GITHUB_REF_NAME.tar.gz"
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "File Sync $GITHUB_REF_NAME" --notes-file "docs/RELEASE-$(cat VERSION).md"
