name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Build source archives and checksums
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="file_sync-$GITHUB_REF_NAME/" HEAD > "dist/file_sync-$GITHUB_REF_NAME.zip"
          git archive --format=tar.gz --prefix="file_sync-$GITHUB_REF_NAME/" HEAD > "dist/file_sync-$GITHUB_REF_NAME.tar.gz"
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "File Sync $GITHUB_REF_NAME" --notes-file "docs/RELEASE-$(cat VERSION).md"
