; Python 路径可为绝对路径或相对工程路径；空值自动检测随包 python、py、python。
[runtime]
; direct：依赖安装到所选 Python；venv：创建项目虚拟环境（兼容原默认）。
environment = venv
; 示例：E:\python 或 E:\python\python.exe；随包目录填写 python。
python =

; 双击启动同样读取此配置；不修改系统 pip 配置。
[pip]
; auto：沿用已有 pip 配置，否则检测官方源与清华镜像。
; tuna：固定清华镜像；pypi：固定官方源；configured：只用本机 pip 配置。
; 也可填写完整 HTTPS 索引地址，认证信息请放在本机 pip 配置中。
source = auto
